name = "friday-github"
main = "src/worker.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["enable_request_signal", "request_signal_passthrough"]
workers_dev = true

[observability]
enabled = false

[vars]
# Transport scope only; Friday's host still applies repository write approval.
ALLOWED_GIT_REPOS = "your-org/your-repo"
# Keep the verified host credential until the hosted PAT has repository access.
GITHUB_CREDENTIAL_MODE = "caller"

# Set RELAY_TOKEN as a separate Worker secret; never share the OAuth Worker key.
# GITHUB_READ_TOKEN is the user-configured hosted PAT (historical name); it may
# have write scopes. Only RELAY_TOKEN may write. RELAY_READ_TOKEN stays read-only.
